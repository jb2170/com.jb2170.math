<svg xmlns="http://www.w3.org/2000/svg" width="2700" height="1000" viewBox="100 -500 2700 1000">
  <!-- Source:  math.jb2170.com -->
  <!-- License: CC-BY-NC-SA-4.0 -->
  <defs>
    <style>
      .stage-1 { transform: translate( 300px, 0px); }
      .stage-2 { transform: translate( 600px, 0px); }
      .stage-3 { transform: translate( 900px, 0px); }
      .stage-4 { transform: translate(1200px, 0px); }
      .stage-5 { transform: translate(1500px, 0px); }
      .stage-6 { transform: translate(1800px, 0px); }
      .stage-7 { transform: translate(2100px, 0px); }
      .stage-8 { transform: translate(2600px, 0px); }

      .pure-dark { transform: translate(0px, -400px); }
      .semi-dark { transform: translate(0px, -200px); }
      .neutral   { transform: translate(0px,    0px); }
      .semi-hero { transform: translate(0px,  200px); }
      .pure-hero { transform: translate(0px,  400px); }

      .final-dark { transform: translate(0px, -35px); }
      .final-hero { transform: translate(0px, +35px); }

      .first     .mission                        { fill: gold;             }
      .pure-dark .mission                        { fill: firebrick;        }
      .pure-dark .final-dark .mission-final-boss { fill: darkred;          }
      .pure-dark .final-hero .mission-final-boss { fill: indianred;        }
      .semi-dark .mission                        { fill: darkorange;       }
      .semi-dark .final-dark .mission-final-boss { fill: chocolate;        }
      .semi-dark .final-hero .mission-final-boss { fill: orange;           }
      .neutral   .mission                        { fill: mediumseagreen;   }
      .neutral   .final-dark .mission-final-boss { fill: yellowgreen;      }
      .neutral   .final-hero .mission-final-boss { fill: greenyellow;      }
      .semi-hero .mission                        { fill: cornflowerblue;   }
      .semi-hero .final-dark .mission-final-boss { fill: mediumaquamarine; }
      .semi-hero .final-hero .mission-final-boss { fill: skyblue;          }
      .pure-hero .mission                        { fill: darkblue;         }
      .pure-hero .final-dark .mission-final-boss { fill: royalblue;        }
      .pure-hero .final-hero .mission-final-boss { fill: mediumblue;       }
      .credits   .mission                        { fill: pink;             }

      .line         { stroke-width: 6px;  }
      .line-dark    { stroke: red;        }
      .line-neutral { stroke: chartreuse; }
      .line-hero    { stroke: blue;       }

      .text-mission {
        font-family: monospace;
        font-size: 80px;
        dominant-baseline: middle;
        text-anchor: middle;
        stroke: white;
        stroke-width: 12px;
        paint-order: stroke fill;
      }

      .text-mission-final-boss {
        font-family: monospace;
        font-size: 60px;
        dominant-baseline: middle;
        text-anchor: middle;
        stroke: white;
        stroke-width: 9px;
        paint-order: stroke fill;
      }
    </style>

    <rect id="rect-mission" width="200" height="120" x="-100" y="-60" />
    <rect id="rect-mission-final-boss" width="200" height="50" x="-100" y="-25" />

    <line class="line" id="line-up" x1="105" y1="-70" x2="195" y2="-130" />
    <line class="line" id="line-forward" x1="105" y1="0" x2="195" y2="0" />
    <line class="line" id="line-down" x1="105" y1="+70" x2="195" y2="+130" />

    <line class="line" id="final-line-up" x1="105" y1="-15" x2="195" y2="-35" />
    <line class="line" id="final-line-down" x1="105" y1="+15" x2="195" y2="+35" />
  </defs>

  <g>
    <g class="stage-1">
      <g class="first three-ways">
        <use href="#rect-mission" class="mission" />
        <use href="#line-up" class="line-dark" />
        <use href="#line-forward" class="line-neutral" />
        <use href="#line-down" class="line-hero" />
        <text class="text-mission">326</text>
      </g>
    </g>

    <g class="stage-2">
      <g class="semi-dark two-ways">
        <use href="#rect-mission" class="mission" />
        <use href="#line-forward" class="line-dark" />
        <use href="#line-down" class="line-hero" />
        <text class="text-mission">94</text>
      </g>

      <g class="neutral three-ways">
        <use href="#rect-mission" class="mission" />
        <use href="#line-up" class="line-dark" />
        <use href="#line-forward" class="line-neutral" />
        <use href="#line-down" class="line-hero" />
        <text class="text-mission">138</text>
      </g>

      <g class="semi-hero two-ways">
        <use href="#rect-mission" class="mission" />
        <use href="#line-up" class="line-dark" />
        <use href="#line-forward" class="line-hero" />
        <text class="text-mission">94</text>
      </g>
    </g>

    <g class="stage-3">
      <g class="semi-dark three-ways">
        <use href="#rect-mission" class="mission" />
        <use href="#line-up" class="line-dark" />
        <use href="#line-forward" class="line-neutral" />
        <use href="#line-down" class="line-hero" />
        <text class="text-mission">88</text>
      </g>

      <g class="neutral three-ways">
        <use href="#rect-mission" class="mission" />
        <use href="#line-up" class="line-dark" />
        <use href="#line-forward" class="line-neutral" />
        <use href="#line-down" class="line-hero" />
        <text class="text-mission">150</text>
      </g>

      <g class="semi-hero three-ways">
        <use href="#rect-mission" class="mission" />
        <use href="#line-up" class="line-dark" />
        <use href="#line-forward" class="line-neutral" />
        <use href="#line-down" class="line-hero" />
        <text class="text-mission">88</text>
      </g>
    </g>

    <g class="stage-4">
      <g class="pure-dark two-ways">
        <use href="#rect-mission" class="mission" />
        <use href="#line-forward" class="line-dark" />
        <use href="#line-down" class="line-hero" />
        <text class="text-mission">20</text>
      </g>

      <g class="semi-dark three-ways">
        <use href="#rect-mission" class="mission" />
        <use href="#line-up" class="line-dark" />
        <use href="#line-forward" class="line-neutral" />
        <use href="#line-down" class="line-hero" />
        <text class="text-mission">80</text>
      </g>

      <g class="neutral three-ways">
        <use href="#rect-mission" class="mission" />
        <use href="#line-up" class="line-dark" />
        <use href="#line-forward" class="line-neutral" />
        <use href="#line-down" class="line-hero" />
        <text class="text-mission">126</text>
      </g>

      <g class="semi-hero three-ways">
        <use href="#rect-mission" class="mission" />
        <use href="#line-up" class="line-dark" />
        <use href="#line-forward" class="line-neutral" />
        <use href="#line-down" class="line-hero" />
        <text class="text-mission">80</text>
      </g>

      <g class="pure-hero two-ways">
        <use href="#rect-mission" class="mission" />
        <use href="#line-up" class="line-dark" />
        <use href="#line-forward" class="line-hero" />
        <text class="text-mission">20</text>
      </g>
    </g>

    <g class="stage-5">
      <g class="pure-dark two-ways">
        <use href="#rect-mission" class="mission" />
        <use href="#line-forward" class="line-dark" />
        <use href="#line-down" class="line-neutral" />
        <text class="text-mission">28</text>
      </g>

      <g class="semi-dark three-ways">
        <use href="#rect-mission" class="mission" />
        <use href="#line-up" class="line-dark" />
        <use href="#line-forward" class="line-neutral" />
        <use href="#line-down" class="line-hero" />
        <text class="text-mission">84</text>
      </g>

      <g class="neutral three-ways">
        <use href="#rect-mission" class="mission" />
        <use href="#line-up" class="line-dark" />
        <use href="#line-forward" class="line-neutral" />
        <use href="#line-down" class="line-hero" />
        <text class="text-mission">102</text>
      </g>

      <g class="semi-hero three-ways">
        <use href="#rect-mission" class="mission" />
        <use href="#line-up" class="line-dark" />
        <use href="#line-forward" class="line-neutral" />
        <use href="#line-down" class="line-hero" />
        <text class="text-mission">84</text>
      </g>

      <g class="pure-hero two-ways">
        <use href="#rect-mission" class="mission" />
        <use href="#line-up" class="line-neutral" />
        <use href="#line-forward" class="line-hero" />
        <text class="text-mission">28</text>
      </g>
    </g>

    <g class="stage-6">
      <g class="pure-dark two-ways">
        <use href="#rect-mission" class="mission" />
        <use href="#final-line-up" class="line-dark" />
        <use href="#final-line-down" class="line-hero" />
        <text class="text-mission">42</text>
      </g>

      <g class="semi-dark two-ways">
        <use href="#rect-mission" class="mission" />
        <use href="#final-line-up" class="line-dark" />
        <use href="#final-line-down" class="line-hero" />
        <text class="text-mission">76</text>
      </g>

      <g class="neutral two-ways">
        <use href="#rect-mission" class="mission" />
        <use href="#final-line-up" class="line-dark" />
        <use href="#final-line-down" class="line-hero" />
        <text class="text-mission">90</text>
      </g>

      <g class="semi-hero two-ways">
        <use href="#rect-mission" class="mission" />
        <use href="#final-line-up" class="line-dark" />
        <use href="#final-line-down" class="line-hero" />
        <text class="text-mission">76</text>
      </g>

      <g class="pure-hero two-ways">
        <use href="#rect-mission" class="mission" />
        <use href="#final-line-up" class="line-dark" />
        <use href="#final-line-down" class="line-hero" />
        <text class="text-mission">42</text>
      </g>
    </g>

    <g class="stage-7">
      <g class="pure-dark">
        <g class="final-dark">
          <use href="#rect-mission-final-boss" class="mission-final-boss" />
          <text class="text-mission-final-boss">21</text>
        </g>
        <g class="final-hero">
          <use href="#rect-mission-final-boss" class="mission-final-boss" />
          <text class="text-mission-final-boss">21</text>
        </g>
      </g>

      <g class="semi-dark">
        <g class="final-dark">
          <use href="#rect-mission-final-boss" class="mission-final-boss" />
          <text class="text-mission-final-boss">38</text>
        </g>
        <g class="final-hero">
          <use href="#rect-mission-final-boss" class="mission-final-boss" />
          <text class="text-mission-final-boss">38</text>
        </g>
      </g>

      <g class="neutral">
        <g class="final-dark">
          <use href="#rect-mission-final-boss" class="mission-final-boss" />
          <text class="text-mission-final-boss">45</text>
        </g>
        <g class="final-hero">
          <use href="#rect-mission-final-boss" class="mission-final-boss" />
          <text class="text-mission-final-boss">45</text>
        </g>
      </g>

      <g class="semi-hero">
        <g class="final-dark">
          <use href="#rect-mission-final-boss" class="mission-final-boss" />
          <text class="text-mission-final-boss">38</text>
        </g>
        <g class="final-hero">
          <use href="#rect-mission-final-boss" class="mission-final-boss" />
          <text class="text-mission-final-boss">38</text>
        </g>
      </g>

      <g class="pure-hero">
        <g class="final-dark">
          <use href="#rect-mission-final-boss" class="mission-final-boss" />
          <text class="text-mission-final-boss">21</text>
        </g>
        <g class="final-hero">
          <use href="#rect-mission-final-boss" class="mission-final-boss" />
          <text class="text-mission-final-boss">21</text>
        </g>
      </g>
    </g>

    <g class="stage-8">
      <g class="credits">
        <use href="#rect-mission" class="mission" />
        <line class="line" style="stroke: black;" id="line-up" x1="-395" y1="-435" x2="-105" y2="0" />
        <line class="line" style="stroke: black;" id="line-up" x1="-395" y1="-365" x2="-105" y2="0" />
        <line class="line" style="stroke: black;" id="line-up" x1="-395" y1="-235" x2="-105" y2="0" />
        <line class="line" style="stroke: black;" id="line-up" x1="-395" y1="-165" x2="-105" y2="0" />
        <line class="line" style="stroke: black;" id="line-up" x1="-395" y1=" -35" x2="-105" y2="0" />
        <line class="line" style="stroke: black;" id="line-up" x1="-395" y1="  35" x2="-105" y2="0" />
        <line class="line" style="stroke: black;" id="line-up" x1="-395" y1="+165" x2="-105" y2="0" />
        <line class="line" style="stroke: black;" id="line-up" x1="-395" y1="+235" x2="-105" y2="0" />
        <line class="line" style="stroke: black;" id="line-up" x1="-395" y1="+365" x2="-105" y2="0" />
        <line class="line" style="stroke: black;" id="line-up" x1="-395" y1="+435" x2="-105" y2="0" />
        <text class="text-mission">326</text>
      </g>
    </g>
  </g>

</svg>
